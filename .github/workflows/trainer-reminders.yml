name: Trainer interview reminders

on:
  schedule:
    # Three redundant triggers cover GitHub-hosted scheduler delays up to 40 minutes.
    # The API's 20–40 minute due window and database deduplication ensure that only
    # the trigger which actually lands near the interview sends each notification.
    - cron: '0 4 * * 1-3'
    - cron: '15 4 * * 1-3'
    - cron: '30 4 * * 1-3'
    - cron: '0 14 * * 4-5'
    - cron: '15 14 * * 4-5'
    - cron: '30 14 * * 4-5'
    - cron: '0 2 * * 6'
    - cron: '15 2 * * 6'
    - cron: '30 2 * * 6'
    # Post-interview no-show follow-up, 90 minutes after each regular slot.
    - cron: '30 6 * * 1-3'
    - cron: '30 16 * * 4-5'
    - cron: '30 4 * * 6'
  workflow_dispatch:

concurrency:
  group: trainer-interview-reminders
  cancel-in-progress: false

jobs:
  send-due-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger protected reminder endpoint
        env:
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          test -n "$REMINDER_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $REMINDER_CRON_SECRET" \
            https://academy-strateg-trainer.vercel.app/api/reminders
