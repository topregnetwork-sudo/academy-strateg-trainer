name: Trainer interview reminders

on:
  # No background schedule. This workflow runs only after an explicit manual
  # action in GitHub; operator and bot actions remain separate and immediate.
  workflow_dispatch:

concurrency:
  group: trainer-interview-reminders
  cancel-in-progress: false

jobs:
  send-due-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger protected reminder endpoint
        env:
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          test -n "$REMINDER_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $REMINDER_CRON_SECRET" \
            https://academy-strateg-trainer.vercel.app/api/reminders
