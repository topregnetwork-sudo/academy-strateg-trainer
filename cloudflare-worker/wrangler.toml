name = "academy-strateg-trainer-fallback"
main = "src/index.js"
compatibility_date = "2026-08-21"
workers_dev = true

[[durable_objects.bindings]]
name = "FUNNEL_TIMERS"
class_name = "FunnelTimer"

[[migrations]]
tag = "funnel-timers-v1"
new_sqlite_classes = ["FunnelTimer"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
PUBLIC_ORIGIN = "https://topregnetwork-sudo.github.io/academy-strateg-trainer"
PANEL_ORIGIN = "https://academy-strateg-trainer.vercel.app"
TIMED_AUTOMATION_ENDPOINT = "https://academy-strateg-trainer.vercel.app/api/reminders"

[triggers]
crons = [
  "30 2,4 * * 1-3,6",
  "30 14 * * 4-5",
  "30 6 * * 1-3",
  "30 16 * * 4-5"
]
